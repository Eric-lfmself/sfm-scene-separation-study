name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install lightweight dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Inspect CLI without loading model weights
        run: python src/run_experiments.py --help
      - name: Regression checks
        run: python -m unittest discover -s tests -v
      - name: Validate source tables, links, figures and manuscript exclusion
        run: python tools/validate_repository.py
      - name: Rebuild figures without downloads
        run: python tools/make_figures.py
      - name: Validate regenerated figures
        run: python tools/validate_repository.py
