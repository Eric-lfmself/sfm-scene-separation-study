<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 322" width="880" height="322" role="img" aria-label="Inlier ranges for four kinds of image-pair link on a log scale. True within-scene links have a median of 302 and true cross-session revisit links a median of 51. False cross-scene links between lookalike places have a median of 22 and reach 83, overlapping the true revisit population. False cross-site links between visually unlike aerial sites have a median of 16 and never exceed 37." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
